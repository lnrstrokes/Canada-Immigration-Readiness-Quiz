    <g transform="translate(240, 225)">
      <!-- Outer Navy Aperture Ring -->
      <path d="M -10 -150 A 150 150 0 0 1 140 -50 L 100 -35 A 110 110 0 0 0 -7 -110 Z" fill="#0a2540" />
      <path d="M 150 -10 A 150 150 0 0 1 50 140 L 35 100 A 110 110 0 0 0 110 -7 Z" fill="#0a2540" />
      <path d="M 10 150 A 150 150 0 0 1 -140 50 L -100 35 A 110 110 0 0 0 7 110 Z" fill="#0a2540" />
      <path d="M -150 10 A 150 150 0 0 1 -50 -140 L -35 -100 A 110 110 0 0 0 -110 7 Z" fill="#0a2540" />
      
      <!-- Inner White Circle -->
      <circle cx="0" cy="0" r="102" fill="#ffffff" />
      
      <!-- Canadian Maple Leaf -->
      <path d="M 0 -70 Q 2 -55 8 -48 L 22 -52 Q 18 -42 14 -35 L 32 -30 Q 28 -18 24 -10 L 42 2 L 20 12 L 26 32 Q 14 26 8 26 L 5 58 L -5 58 L -8 26 Q -14 26 -26 32 L -20 12 L -42 2 L -24 -10 Q -28 -18 -32 -30 L -14 -35 Q -18 -42 -22 -52 L -8 -48 Q -2 -55 0 -70 Z" fill="#0a2540" />
    </g>

    <!-- Right S Ribbon with White Flow Arrows -->
