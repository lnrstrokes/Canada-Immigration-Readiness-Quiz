      <!-- Main Red S Ribbon -->
      <path d="M -40 -125 C 50 -125, 125 -85, 125 -25 C 125 45, 30 55, -20 75 C -75 95, -85 125, -85 150 C -85 185, -45 205, 10 205 C 70 205, 115 165, 135 120 L 175 138 C 148 202, 92 245, 8 245 C -82 245, -130 200, -130 145 C -130 82, -30 60, 20 42 C 70 25, 80 -5, 80 -30 C 80 -65, 42 -85, -20 -85 C -80 -85, -125 -48, -140 -10 L -180 -25 C -158 -88, -98 -125, -40 -125 Z" fill="#d92626" />
      
      <!-- White arrows on S ribbon -->
      <path d="M 20 -105 L 90 -105 L 65 -125 M 90 -105 L 65 -85" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <path d="M 0 170 L -70 170 L -45 150 M -70 170 L -45 190" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    </g>
